[package]
name = "lumbridge-voice"
description = "Lumbridge Voice: the speech-to-text HTTP front. Same API as the Python front it replaces; the model sits behind an adapter."
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/lumbridge-corp/lumbridge-voice"
homepage = "https://lumbridgecorp.com"
readme = "README.md"
publish = false

[[bin]]
name = "lumbridge-voice"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
regex = "1"
base64 = "0.22"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
strip = true
lto = true
